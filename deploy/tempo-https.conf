limit_req_zone $binary_remote_addr zone=tempo_api:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=tempo_shares:1m rate=2r/s;
server {
    listen 443 ssl;
    server_name 88.96.45.138;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/88.96.45.138/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/88.96.45.138/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1k;
    access_log off;
    location ~ ^/soundcloud-tempo-control/(api/shares|listen)(/|$) {
        client_max_body_size 20k;
        limit_req zone=tempo_shares burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4324;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
    location ~ "^/soundcloud-tempo-control/media/([a-f0-9]{32})\.(mp4|jpg)$" {
        alias /var/lib/tempo-shares/media/$1.$2;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
        limit_rate 1m;
        max_ranges 1;
    }
    location /soundcloud-tempo-control/api/ {
        limit_req zone=tempo_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4322;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 45s;
        proxy_connect_timeout 5s;
    }
    location / { return 404; }
}
